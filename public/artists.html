<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Исполнители — MRF</title>
  <link rel="icon" href="img/favicon.svg?v=2" type="image/svg+xml" sizes="any"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content" id="main-content">
  <div id="topbar-root"></div>
  <div class="feed">

    <div class="artists-page-head">
      <div>
        <div class="artists-page-kicker">Подписки</div>
        <h2 class="artists-page-title">Мои исполнители</h2>
        <p class="artists-page-sub" id="artists-count">0 подписок</p>
      </div>
    </div>

    <div id="artists-grid"></div>

  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
whenDomReady(() => {
  initShared();
  renderArtistsPage();
});

window.renderArtistsPage = renderArtistsPage;
function renderArtistsPage() {
  const followed = Store.getFollowed();
  const countEl = document.getElementById('artists-count');
  const box = document.getElementById('artists-grid');

  if (countEl) countEl.textContent = followed.length + ' ' + (followed.length === 1 ? 'подписка' : followed.length < 5 ? 'подписки' : 'подписок');

  if (!followed.length) {
    box.innerHTML = `<div class="search-empty" style="padding:60px 0">
      <svg viewBox="0 0 24 24" fill="none" width="48" height="48" style="color:var(--text-3);margin-bottom:12px">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <p style="color:var(--text-3)">Подпишись на исполнителей</p>
    </div>`;
    return;
  }

  box.innerHTML = '<div class="artists-grid artists-grid-follow">' + followed.map(a => {
    const id = a.id != null ? (typeof jsStr === 'function' ? jsStr(a.id) : String(a.id).replace(/'/g, "\\'")) : '';
    const name = a.name || '';
    const safeName = typeof jsStr === 'function' ? jsStr(name) : name.replace(/'/g, "\\'");
    const letter = escHtml((name || '?')[0]);
    return `
    <button type="button" class="artist-tile" onclick="openArtist(${id ? `'${id}'` : 'null'},'${safeName}')">
      <span class="artist-tile-photo">
        ${a.picture
          ? `<img src="${a.picture}" alt="">`
          : `<span class="artist-tile-ph">${letter}</span>`}
      </span>
      <span class="artist-tile-meta">
        <span class="artist-tile-name">${escHtml(name)}</span>
        ${a.fans ? `<span class="artist-tile-fans">${(+a.fans).toLocaleString('ru')} фанатов</span>` : `<span class="artist-tile-fans">Исполнитель</span>`}
      </span>
    </button>`;
  }).join('') + '</div>';
}
</script>
</body>
</html>
