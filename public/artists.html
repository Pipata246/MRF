<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Исполнители — MRF</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content">
  <div id="topbar-root"></div>
  <div class="feed">

    <div style="margin-bottom:28px">
      <h2 style="font-size:28px;font-weight:800">Мои исполнители</h2>
      <p style="color:var(--text-3);font-size:13px;margin-top:4px" id="artists-count">0 подписок</p>
    </div>

    <div id="artists-grid"></div>

  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
whenDomReady(() => {
  initShared();
  renderArtistsPage();
});

function renderArtistsPage() {
  const followed = Store.getFollowed();
  const countEl = document.getElementById('artists-count');
  const box = document.getElementById('artists-grid');

  if (countEl) countEl.textContent = followed.length + ' ' + (followed.length === 1 ? 'подписка' : followed.length < 5 ? 'подписки' : 'подписок');

  if (!followed.length) {
    box.innerHTML = `<div class="search-empty" style="padding:60px 0">
      <svg viewBox="0 0 24 24" fill="none" width="48" height="48" style="color:var(--text-3);margin-bottom:12px">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <p style="color:var(--text-3)">Подпишись на исполнителей</p>
    </div>`;
    return;
  }

  box.innerHTML = '<div class="artists-grid">' + followed.map(a => `
    <div class="artist-card" onclick="location.href='${mrfUrl('artist',{id:a.id,name:a.name})}'">
      ${a.picture ? `<img class="artist-img" src="${a.picture}" alt="">` : `<div class="artist-img-placeholder">${(a.name||'?')[0]}</div>`}
      <div class="artist-name">${escHtml(a.name)}</div>
      <div class="artist-listeners">${a.fans ? (+a.fans).toLocaleString('ru') + ' фанатов' : ''}</div>
    </div>`).join('') + '</div>';
}
</script>
</body>
</html>
