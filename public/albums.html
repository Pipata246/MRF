<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Альбомы и релизы — MRF</title>
  <link rel="icon" href="img/favicon.svg?v=2" type="image/svg+xml" sizes="any"/>
  <link rel="stylesheet" href="style.css"/>
  <script>
  /* Layout boot: large screens = PC, smaller = mobile shell */
  (function () {
    try {
      var desktop = window.matchMedia('(min-width: 901px)').matches;
      document.documentElement.setAttribute('data-ui', desktop ? 'desktop' : 'mobile');
    } catch (e) {
      document.documentElement.setAttribute('data-ui', 'mobile');
    }
  })();
  </script>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content" id="main-content">
  <div id="topbar-root"></div>
  <div class="feed">
    <div style="margin-bottom:28px">
      <h2 style="font-size:28px;font-weight:800">Альбомы и релизы</h2>
      <p style="color:var(--text-3);font-size:13px;margin-top:4px">Сохранённые альбомы и релизы</p>
    </div>
    <div id="albums-box"></div>
  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
whenDomReady(() => {
  initShared();
  renderSavedAlbums();
});

function renderAlbumsPage() { renderSavedAlbums(); }
window.renderAlbumsPage = renderAlbumsPage;
window.renderSavedAlbums = renderSavedAlbums;

function renderSavedAlbums() {
  const box = document.getElementById('albums-box');
  const albs = Store.getAlbums();
  if (!albs.length) {
    box.innerHTML = `<div class="search-empty" style="padding:60px 0">
      <svg viewBox="0 0 24 24" fill="none" width="48" height="48" style="color:var(--text-3);margin-bottom:12px">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <p style="color:var(--text-3)">Сохраняй альбомы, чтобы они появились здесь</p>
      <button class="btn-secondary" style="margin-top:16px;padding:10px 18px" onclick="(window.mrfGo||function(u){location.href=u})('search.html')">Найти альбомы</button>
    </div>`;
    return;
  }
  box.innerHTML = `<div class="albums-grid">${albs.map(a => {
    const safeId = typeof jsStr === 'function' ? jsStr(a.id) : String(a.id ?? '').replace(/'/g, "\\'");
    const safeTitle = typeof jsStr === 'function' ? jsStr(a.title) : String(a.title || '').replace(/'/g, "\\'");
    const safeArtist = typeof jsStr === 'function' ? jsStr(a.artistName) : String(a.artistName || '').replace(/'/g, "\\'");
    return `
    <div class="album-card" onclick="openSavedAlbum('${safeId}','${safeTitle}','${safeArtist}')">
      ${a.cover ? `<img class="album-cover" src="${a.cover}" alt="">` : `<div class="album-cover-placeholder">${noteSVGShared()}</div>`}
      <div class="album-body">
        <div class="album-title">${escHtml(a.title || '')}</div>
        <div class="album-artist">${escHtml(a.artistName || '')}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
</script>
</body>
</html>
