<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Поиск — MRF</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content" id="main-content">
  <div id="topbar-root"></div>
  <div class="feed" id="feed">

    <div id="search-initial" class="search-home">
      <input type="hidden" id="search-input" value=""/>

      <header class="search-home-head">
        <h2 class="search-home-title">Поиск</h2>
        <p class="search-home-sub">Пиши в поле сверху — результаты появятся здесь</p>
      </header>

      <section id="search-history-section" class="section search-history-section" style="display:none">
        <div class="section-header">
          <h3 class="section-title">Недавние запросы</h3>
          <button type="button" class="section-link" onclick="clearSearchHistory()">Очистить</button>
        </div>
        <div class="search-history-chips" id="search-history-list"></div>
      </section>

      <section class="section search-vibe-section">
        <div class="section-header">
          <h3 class="section-title">Быстрый вайб</h3>
        </div>
        <div class="search-vibe-row" id="search-vibe-row">
          <button type="button" class="search-vibe-chip" style="--vibe:#3a2433" onclick="doSearch('love songs')">Любовь</button>
          <button type="button" class="search-vibe-chip" style="--vibe:#1f322e" onclick="doSearch('night drive')">Ночная дорога</button>
          <button type="button" class="search-vibe-chip" style="--vibe:#2a3040" onclick="doSearch('workout')">Зал</button>
          <button type="button" class="search-vibe-chip" style="--vibe:#2e3a48" onclick="doSearch('sad songs')">Тишина</button>
          <button type="button" class="search-vibe-chip" style="--vibe:#3a2c24" onclick="doSearch('party hits')">Вечеринка</button>
          <button type="button" class="search-vibe-chip" style="--vibe:#2c2618" onclick="doSearch('focus study')">Фокус</button>
          <button type="button" class="search-vibe-chip" style="--vibe:#24302c" onclick="doSearch('chill acoustic')">Акустика</button>
          <button type="button" class="search-vibe-chip" style="--vibe:#332028" onclick="doSearch('summer hits')">Лето</button>
        </div>
      </section>

      <section class="section search-popular-section">
        <div class="section-header">
          <h3 class="section-title">Популярные артисты</h3>
        </div>
        <div class="search-popular-grid" id="search-popular-grid">
          <div class="loading-placeholder"><div class="spinner"></div></div>
        </div>
      </section>

      <section class="section search-trend-section">
        <div class="section-header">
          <h3 class="section-title">Слушают прямо сейчас</h3>
          <a href="charts.html" class="section-link">Чарт →</a>
        </div>
        <div class="search-trend-grid" id="search-trend-grid">
          <div class="loading-placeholder"><div class="spinner"></div></div>
        </div>
      </section>

      <section class="section search-albums-section">
        <div class="section-header">
          <h3 class="section-title">Альбомы в фокусе</h3>
          <div class="rail-nav" data-rail="search-albums-rail"></div>
        </div>
        <div class="rail-wrap">
          <div class="search-albums-rail" id="search-albums-rail">
            <div class="loading-placeholder"><div class="spinner"></div></div>
          </div>
        </div>
      </section>
    </div>

    <div id="search-results-section" style="display:none">
      <div class="search-tabs" id="search-tabs">
        <button class="tab-btn active" onclick="switchSearchTab('all',this)">Всё</button>
        <button class="tab-btn" onclick="switchSearchTab('tracks',this)">Треки</button>
        <button class="tab-btn" onclick="switchSearchTab('artists',this)">Артисты</button>
        <button class="tab-btn" onclick="switchSearchTab('albums',this)">Альбомы</button>
        <button class="tab-btn" onclick="switchSearchTab('playlists',this)">Плейлисты</button>
      </div>
      <div id="search-results"></div>
    </div>

  </div>
</main>
<div id="player-root"></div>

<script src="mock.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script src="search-page.js"></script>
</body>
</html>
