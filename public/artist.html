<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Артист — MRF</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content">
  <div id="topbar-root"></div>
  <div class="feed" id="artist-feed">
    <div class="loading-placeholder"><div class="spinner"></div><span>Загружаем артиста…</span></div>
  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
whenDomReady(() => {
  initShared();
  loadArtistPage();
});

async function loadArtistPage() {
  const params = new URLSearchParams(location.search);
  let id = params.get('id');
  const name = params.get('name') || '';
  const feed = document.getElementById('artist-feed');
  if (!feed) return;

  // invalid id strings from broken links
  if (!id || id === 'undefined' || id === 'null' || id === '0') id = null;

  // resolve by name if id missing
  if (!id && name) {
    feed.innerHTML = `<div class="loading-placeholder"><div class="spinner"></div><span>Ищем артиста…</span></div>`;
    const found = await dzArr(`/search/artist?q=${encodeURIComponent(name)}&limit=5`);
    const exact = found.find(a => (a.name || '').toLowerCase() === name.toLowerCase()) || found[0];
    if (exact?.id) {
      id = String(exact.id);
      history.replaceState(null, '', mrfUrl('artist', { id, name: exact.name || name }));
    }
  }

  if (!id) {
    feed.innerHTML = `
      <div class="search-empty" style="padding:48px 0;text-align:center">
        <p style="color:var(--text-3);margin-bottom:14px">Артист не найден</p>
        <button class="btn-primary" style="padding:10px 18px;font-size:13px" onclick="location.href='search.html'">К поиску</button>
      </div>`;
    return;
  }

  feed.innerHTML = `<div class="loading-placeholder"><div class="spinner"></div><span>Загружаем артиста…</span></div>`;

  // BACKEND TODO: Получение информации об исполнителе
  const [artInfo, tracksRaw] = await Promise.all([
    dzObj(`/artist/${id}`),
    dzArr(`/artist/${id}/top?limit=50`)
  ]);

  if (!artInfo || !artInfo.id) {
    feed.innerHTML = `
      <div class="search-empty" style="padding:48px 0;text-align:center">
        <p style="color:var(--text-3);margin-bottom:14px">Артист не найден</p>
        <button class="btn-primary" style="padding:10px 18px;font-size:13px" onclick="location.href='${name ? mrfUrl('search', { q: name }) : 'search.html'}'">К поиску</button>
      </div>`;
    return;
  }

  const img   = artInfo.picture_xl || artInfo.picture_medium || '';
  const fans  = artInfo.nb_fan ? (+artInfo.nb_fan).toLocaleString('ru') + ' фанатов' : '';
  const aName = artInfo.name || name;
  const key   = `art_${id}`;
  _src[key]   = (tracksRaw || []).map(normDZ);

  document.title = aName + ' — MRF';

  const isFollowing = Store.isFollowing(id);

  feed.innerHTML = `
    <div style="display:flex;gap:28px;align-items:flex-start;margin-bottom:32px;flex-wrap:wrap">
      ${img ? `<img src="${img}" style="width:160px;height:160px;border-radius:50%;object-fit:cover;flex-shrink:0" alt="">` : `<div style="width:160px;height:160px;border-radius:50%;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:var(--accent);flex-shrink:0">${(aName||'?')[0]}</div>`}
      <div style="display:flex;flex-direction:column;justify-content:center;gap:8px">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:2px">Артист</div>
        <h2 style="font-size:40px;font-weight:800">${escHtml(aName)}</h2>
        <div style="color:var(--text-3);font-size:13px">${fans}</div>
        <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
          <button class="btn-primary" onclick="playFromSrc('${key}',0)" style="padding:10px 20px;font-size:13px" ${!_src[key].length ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5,3 19,12 5,21"/></svg>
            Слушать всё
          </button>
          <button class="btn-secondary" id="follow-btn" onclick="toggleArtistFollow(${JSON.stringify(String(id))},'${escHtml(aName).replace(/'/g, "\\'")}','${img}')" style="padding:10px 18px;font-size:13px">
            ${isFollowing ? 'Вы подписаны' : 'Подписаться'}
          </button>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h3 style="font-size:18px;font-weight:700">Популярные треки <span id="art-count" style="font-size:13px;color:var(--text-3);font-weight:400">(${_src[key].length})</span></h3>
    </div>
    <div class="track-list">${_src[key].length
      ? _src[key].map((t,i) => rowHTML(t,i,key)).join('')
      : `<div class="search-empty" style="padding:20px 0"><p style="color:var(--text-3)">Треки не найдены</p></div>`}</div>`;
}

function toggleArtistFollow(id, name, picture) {
  const added = Store.toggleFollow({ id, name, picture, fans: 0 });
  const btn = document.getElementById('follow-btn');
  if (btn) btn.textContent = added ? 'Вы подписаны' : 'Подписаться';
  showNotif(added ? 'Подписка оформлена' : 'Подписка отменена');
}
</script>
</body>
</html>
