<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Альбом — MRF</title>
  <link rel="icon" href="img/favicon.svg?v=2" type="image/svg+xml" sizes="any"/>
  <link rel="stylesheet" href="style.css"/>
  <script>
  /* Layout boot: large screens = PC, smaller = mobile shell */
  (function () {
    try {
      var desktop = window.matchMedia('(min-width: 901px)').matches;
      document.documentElement.setAttribute('data-ui', desktop ? 'desktop' : 'mobile');
    } catch (e) {
      document.documentElement.setAttribute('data-ui', 'mobile');
    }
  })();
  </script>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content" id="main-content">
  <div id="topbar-root"></div>
  <div class="feed" id="album-feed">
    <div class="loading-placeholder"><div class="spinner"></div><span>Загружаем альбом…</span></div>
  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="backend.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
function bootAlbumPage() {
  initShared();
  // Soft-nav will call loadAlbumPage(forced) with URL params — avoid double-load race
  if (window.__mrfSoftNavigating) return;
  loadAlbumPage();
}
window.bootAlbumPage = bootAlbumPage;

if (typeof whenDomReady === 'function') whenDomReady(bootAlbumPage);
else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootAlbumPage);
else bootAlbumPage();

async function loadAlbumPage(forced) {
  const hasForced = forced != null && typeof forced === 'object';
  const params = new URLSearchParams(location.search);
  let rawId = '';
  let albumTitle = '';
  let artistName = '';

  if (hasForced) {
    // Soft-nav: trust ONLY forced args (never stale sessionStorage)
    rawId = forced.id != null && String(forced.id) !== '' ? String(forced.id) : '';
    albumTitle = forced.title != null && String(forced.title) !== '' ? String(forced.title) : '';
    artistName = forced.artist != null && String(forced.artist) !== '' ? String(forced.artist) : '';
    if (!rawId) rawId = String(params.get('id') || '');
    if (!albumTitle) albumTitle = String(params.get('title') || '');
    if (!artistName) artistName = String(params.get('artist') || '');
  } else {
    rawId = String(params.get('id') || '');
    albumTitle = String(params.get('title') || '');
    artistName = String(params.get('artist') || '');
    if (!rawId && !albumTitle && !artistName) {
      try {
        const saved = JSON.parse(sessionStorage.getItem('mrf_route_album') || '{}');
        rawId = saved.id || '';
        albumTitle = saved.title || '';
        artistName = saved.artist || '';
      } catch (_) {}
    }
  }

  const feed = document.getElementById('album-feed');
  if (!feed) return;
  try {
    sessionStorage.setItem('mrf_route_album', JSON.stringify({
      id: rawId || '', title: albumTitle || '', artist: artistName || ''
    }));
  } catch (_) {}

  let id = (typeof normalizeDeezerId === 'function' ? normalizeDeezerId(rawId) : rawId) || '';
  if (!id || id === 'undefined' || id === 'null' || id === '0') id = '';

  window.__albumLoadGen = (window.__albumLoadGen || 0) + 1;
  const gen = window.__albumLoadGen;

  // Resolve by title+artist if id missing/stale
  if (!id && (albumTitle || artistName)) {
    feed.innerHTML = `<div class="loading-placeholder"><div class="spinner"></div><span>Ищем альбом…</span></div>`;
    try {
      const q = [albumTitle, artistName].filter(Boolean).join(' ');
      const found = await dzArr(`/search/album?q=${encodeURIComponent(q)}&limit=10`);
      if (gen !== window.__albumLoadGen || !document.getElementById('album-feed')) return;
      const exact = found.find(a =>
        (!albumTitle || (a.title || '').toLowerCase() === albumTitle.toLowerCase()) &&
        (!artistName || (a.artist?.name || '').toLowerCase() === artistName.toLowerCase())
      ) || found[0];
      if (exact?.id) {
        id = String(exact.id);
        albumTitle = exact.title || albumTitle;
        artistName = exact.artist?.name || artistName;
        try { history.replaceState({ mrfSoft: 1 }, '', mrfUrl('album', { id, title: albumTitle, artist: artistName })); } catch (_) {}
      }
    } catch (_) {}
  }

  if (!id) {
    if (gen !== window.__albumLoadGen || !document.getElementById('album-feed')) return;
    feed.innerHTML = `
      <div class="search-empty" style="padding:48px 0;text-align:center">
        <p style="color:var(--text-3);margin-bottom:14px">Альбом не найден</p>
        <button class="btn-primary" style="padding:10px 18px;font-size:13px" onclick="(window.mrfGo||function(u){location.href=u})('search.html')">К поиску</button>
      </div>`;
    return;
  }

  feed.innerHTML = `<div class="loading-placeholder"><div class="spinner"></div><span>Загружаем альбом…</span></div>`;

  // BACKEND TODO: Получение информации об альбоме
  let album = {};
  try { album = await dzObj(`/album/${id}`); } catch (_) { album = {}; }
  if (gen !== window.__albumLoadGen || !document.getElementById('album-feed')) return;
  if (album && album.error) album = {};

  if (!album || !album.id) {
    // retry search
    if (albumTitle || artistName) {
      try {
        const q = [albumTitle, artistName].filter(Boolean).join(' ');
        const found = await dzArr(`/search/album?q=${encodeURIComponent(q)}&limit=10`);
        if (gen !== window.__albumLoadGen || !document.getElementById('album-feed')) return;
        const exact = found.find(a =>
          (!albumTitle || (a.title || '').toLowerCase() === albumTitle.toLowerCase()) &&
          (!artistName || (a.artist?.name || '').toLowerCase() === artistName.toLowerCase())
        ) || found[0];
        if (exact?.id) {
          id = String(exact.id);
          album = await dzObj(`/album/${id}`);
          if (album && album.error) album = {};
          try { history.replaceState({ mrfSoft: 1 }, '', mrfUrl('album', { id, title: album.title || albumTitle, artist: album.artist?.name || artistName })); } catch (_) {}
        }
      } catch (_) {}
    }
  }
  if (gen !== window.__albumLoadGen || !document.getElementById('album-feed')) return;

  if (!album || !album.id) {
    feed.innerHTML = `
      <div class="search-empty" style="padding:48px 0;text-align:center">
        <p style="color:var(--text-3);margin-bottom:14px">Альбом не найден</p>
        <button class="btn-primary" style="padding:10px 18px;font-size:13px" onclick="(window.mrfGo||function(u){location.href=u})('search.html')">К поиску</button>
      </div>`;
    return;
  }

  const raw   = album.tracks?.data || [];
  const aName = album.artist?.name || artistName;
  const aTitle= album.title || albumTitle;
  const cover = album.cover_xl || album.cover_medium || '';
  const key   = `alb_${id}`;

  _src[key] = raw.map(t => normDZ({
    ...t,
    artist: { id: album.artist?.id, name: aName, picture_medium: album.artist?.picture_medium||'' },
    album:  { id, title: aTitle, cover_medium: album.cover_medium, cover: album.cover }
  }));

  document.title = aTitle + ' — MRF';
  const artistIdJs = album.artist?.id != null && String(album.artist.id) !== ''
    ? `'${jsStr(album.artist.id)}'`
    : 'null';

  feed.innerHTML = `
    <div style="display:flex;gap:28px;align-items:flex-start;margin-bottom:32px;flex-wrap:wrap">
      ${cover ? `<img src="${cover}" style="width:200px;height:200px;border-radius:12px;object-fit:cover;flex-shrink:0" alt="">` : `<div style="width:200px;height:200px;border-radius:12px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;flex-shrink:0">${noteSVGShared()}</div>`}
      <div style="display:flex;flex-direction:column;justify-content:center;gap:8px">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:2px">Альбом</div>
        <h2 style="font-size:32px;font-weight:800">${escHtml(aTitle)}</h2>
        <div style="color:var(--text-3);font-size:14px;cursor:pointer" onclick="openArtist(${artistIdJs},'${jsStr(aName)}')">
          ${escHtml(aName)}
        </div>
        <div style="color:var(--text-3);font-size:12px">${_src[key].length} треков · ${album.release_date||''}</div>
        <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
          <button class="btn-primary" onclick="playFromSrc('${key}',0)" style="padding:10px 20px;font-size:13px;width:fit-content">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5,3 19,12 5,21"/></svg>
            Слушать альбом
          </button>
          <button class="btn-secondary" id="save-album-btn" onclick="toggleSaveAlbum()" style="padding:10px 18px;font-size:13px">
            ${Store.isAlbumSaved(id) ? 'В библиотеке' : 'Сохранить'}
          </button>
          <button class="btn-secondary" onclick="addAlbumToQueue('${key}')" style="padding:10px 18px;font-size:13px">В очередь</button>
        </div>
      </div>
    </div>
    <div class="track-list">${_src[key].map((t,i) => rowHTML(t,i,key)).join('')}</div>`;

  window._albumPageMeta = {
    id, title: aTitle, artistName: aName,
    cover: album.cover_medium || cover,
    year: album.release_date || '',
    trackCount: _src[key].length,
    key
  };
  if (typeof syncPlayingRows === 'function') syncPlayingRows();
}
window.loadAlbumPage = loadAlbumPage;

function toggleSaveAlbum() {
  const m = window._albumPageMeta; if (!m) return;
  const added = Store.toggleAlbum(m);
  const btn = document.getElementById('save-album-btn');
  if (btn) btn.textContent = added ? 'В библиотеке' : 'Сохранить';
  if (typeof notifyLibraryChanged === 'function') notifyLibraryChanged();
  showNotif(added ? 'Альбом сохранён' : 'Альбом удалён из библиотеки');
}
window.toggleSaveAlbum = toggleSaveAlbum;

function addAlbumToQueue(key) {
  (_src[key] || []).forEach(t => addToQueue(t));
  showNotif('Альбом добавлен в очередь');
}
</script>
</body>
</html>
