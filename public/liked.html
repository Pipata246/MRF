<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Любимые треки — MRF</title>
  <link rel="icon" href="img/favicon.svg?v=2" type="image/svg+xml" sizes="any"/>
  <link rel="stylesheet" href="style.css"/>
  <script>
  /* Layout boot: large screens = PC, smaller = mobile shell */
  (function () {
    try {
      var desktop = window.matchMedia('(min-width: 901px)').matches;
      document.documentElement.setAttribute('data-ui', desktop ? 'desktop' : 'mobile');
    } catch (e) {
      document.documentElement.setAttribute('data-ui', 'mobile');
    }
  })();
  </script>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content">
  <div id="topbar-root"></div>
  <div class="feed liked-feed">

    <div class="liked-sticky-bar" id="liked-sticky-bar">
      <div class="liked-sticky-row">
        <button type="button" class="mobile-page-avatar" id="liked-mobile-avatar" onclick="goProfile()" aria-label="Профиль"></button>
        <label class="liked-search-wrap" id="liked-search-wrap" hidden>
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="search" class="liked-search" id="liked-search" placeholder="Найти в любимых…" autocomplete="off" enterkeyhint="search" oninput="filterLikedTracks()"/>
        </label>
      </div>
    </div>

    <section class="liked-hero" id="liked-hero">
      <div class="liked-mosaic" id="liked-mosaic" aria-hidden="true"></div>
      <div class="liked-hero-scrim" aria-hidden="true"></div>
      <div class="liked-hero-main">
        <h1 class="liked-hero-title">Любимые треки</h1>
        <p class="liked-hero-sub" id="liked-count">Пока пусто — отмечай треки сердечком</p>
        <div class="liked-hero-actions">
          <button class="btn-primary liked-play-btn" id="play-all-btn" onclick="playAllLiked()" style="display:none">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5,3 19,12 5,21"/></svg>
            Слушать
          </button>
          <button type="button" class="btn-secondary liked-shuffle-btn" id="shuffle-liked-btn" onclick="shuffleLiked()" style="display:none">Вразброс</button>
        </div>
      </div>
    </section>

    <div class="liked-list-wrap">
      <div class="liked-list-label" id="liked-list-label" hidden>Все треки</div>
      <div id="liked-list"></div>
    </div>

  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
var _likedAllTracks = [];

whenDomReady(() => {
  initShared();
  renderLikedPage();
});

function favToTrack(f) {
  const primary = { id: f.artistId || null, name: f.artist || '' };
  const feats = typeof parseFeatNames === 'function' ? parseFeatNames(f.title || '') : [];
  const artists = typeof uniqArtists === 'function'
    ? uniqArtists([primary, ...feats.map(n => ({ name: n, id: null }))])
    : [primary, ...feats.map(n => ({ name: n, id: null }))];
  return {
    id: f.id || 0,
    title: f.title,
    artist: primary,
    artists,
    artistId: f.artistId || null,
    album: { id: f.albumId || null, title: f.albumTitle || '', cover_medium: f.cover },
    duration: f.duration || 0,
    preview: f.preview || null
  };
}

function renderLikedList(tracks) {
  const box = document.getElementById('liked-list');
  const listLabel = document.getElementById('liked-list-label');
  if (!box) return;
  if (!tracks.length) {
    const q = (document.getElementById('liked-search')?.value || '').trim();
    box.innerHTML = q
      ? `<div class="liked-empty"><p>Ничего не найдено по «${escHtml(q)}»</p></div>`
      : `<div class="liked-empty">
          <div class="liked-empty-line"></div>
          <p>Сердечко у трека — и он появится здесь</p>
          <button class="btn-secondary" style="margin-top:8px;padding:10px 16px" onclick="(window.mrfGo||function(u){location.href=u})('search.html')">Найти музыку</button>
        </div>`;
    if (listLabel) listLabel.hidden = true;
    _src['liked'] = [];
    return;
  }
  if (listLabel) {
    listLabel.hidden = false;
    listLabel.textContent = tracks.length === _likedAllTracks.length
      ? 'Все треки'
      : `Найдено: ${tracks.length}`;
  }
  _src['liked'] = tracks;
  box.innerHTML = `<div class="track-list liked-track-list">${tracks.map((t, i) => rowHTML(t, i, 'liked')).join('')}</div>`;
  if (typeof syncPlayingRows === 'function') syncPlayingRows();
}

function filterLikedTracks() {
  const q = (document.getElementById('liked-search')?.value || '').trim().toLowerCase();
  if (!q) {
    renderLikedList(_likedAllTracks);
    return;
  }
  const filtered = _likedAllTracks.filter(t => {
    const title = String(t.title || '').toLowerCase();
    const artist = String(t.artist?.name || '').toLowerCase();
    const album = String(t.album?.title || '').toLowerCase();
    return title.includes(q) || artist.includes(q) || album.includes(q);
  });
  renderLikedList(filtered);
}
window.filterLikedTracks = filterLikedTracks;

function renderLikedPage() {
  const favs = (typeof Store._sortNewestFirst === 'function'
    ? Store._sortNewestFirst(Store.getFavs())
    : Store.getFavs());
  const countEl = document.getElementById('liked-count');
  const playBtn = document.getElementById('play-all-btn');
  const shuffleBtn = document.getElementById('shuffle-liked-btn');
  const mosaic = document.getElementById('liked-mosaic');
  const hero = document.getElementById('liked-hero');
  const searchWrap = document.getElementById('liked-search-wrap');
  const searchInput = document.getElementById('liked-search');

  const n = favs.length;
  if (countEl) {
    countEl.textContent = n
      ? (n + ' ' + (n === 1 ? 'трек' : n < 5 ? 'трека' : 'треков') + ' в твоей подборке')
      : 'Пока пусто — отмечай треки сердечком';
  }
  if (playBtn) playBtn.style.display = n ? '' : 'none';
  if (shuffleBtn) shuffleBtn.style.display = n ? '' : 'none';
  if (searchWrap) searchWrap.hidden = !n;
  document.getElementById('liked-sticky-bar')?.classList.add('is-ready');
  if (hero) hero.classList.toggle('is-empty', !n);
  if (searchInput && !n) searchInput.value = '';

  if (mosaic) {
    const covers = favs.map(f => f.cover).filter(Boolean);
    if (!covers.length) {
      mosaic.innerHTML = '';
      mosaic.hidden = true;
    } else {
      // Ordered right-side deck: neat staggered grid, light tilt, no empty gaps
      const cols = 4;
      const rows = 3;
      const total = cols * rows;
      const pool = [];
      while (pool.length < total) {
        for (let i = 0; i < covers.length && pool.length < total; i++) pool.push(covers[i]);
      }
      const rots = [-7, 5, -4, 6, -5, 4, -6, 3, -3, 7, -5, 4];
      mosaic.hidden = false;
      mosaic.innerHTML = pool.map((src, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const left = 46 + col * 14.5 + (row % 2 ? 3.5 : 0);
        const top = 8 + row * 30;
        const rot = rots[i % rots.length];
        const z = row * cols + col + 1;
        return `<img class="liked-mosaic-cell" src="${src}" alt="" loading="lazy" style="--c:${col};--r:${row};left:${left}%;top:${top}%;transform:rotate(${rot}deg);z-index:${z}">`;
      }).join('');
    }
  }

  _likedAllTracks = favs.map(favToTrack);
  filterLikedTracks();
  if (typeof updateTopbarAvatar === 'function') updateTopbarAvatar();
}
window.renderLikedPage = renderLikedPage;

function playAllLiked() {
  if (_src['liked']?.length) playFromSrc('liked', 0);
}

function shuffleLiked() {
  const tracks = _src['liked'];
  if (!tracks?.length) return;
  if (typeof isShuffle !== 'undefined') isShuffle = true;
  playFromSrc('liked', Math.floor(Math.random() * tracks.length));
  if (typeof updateShuffleBtn === 'function') updateShuffleBtn();
  showNotif('Перемешивание включено');
}
</script>
</body>
</html>
