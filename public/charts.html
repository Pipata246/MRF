<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чарты — MRF</title>
  <link rel="icon" href="img/favicon.svg?v=3" type="image/svg+xml" sizes="any"/>
  <link rel="stylesheet" href="style.css"/>
  <script>
  /* Layout boot: large screens = PC, smaller = mobile shell */
  (function () {
    try {
      var desktop = window.matchMedia('(min-width: 901px)').matches;
      document.documentElement.setAttribute('data-ui', desktop ? 'desktop' : 'mobile');
    } catch (e) {
      document.documentElement.setAttribute('data-ui', 'mobile');
    }
  })();
  </script>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content" id="main-content">
  <div id="topbar-root"></div>
  <div class="feed" id="feed">

    <header class="charts-hero">
      <div class="charts-hero-copy">
        <h1 class="charts-hero-title" id="charts-hero-title">Мировые чарты</h1>
        <p class="charts-hero-sub" id="charts-hero-sub">Топ-100 треков · обновляется еженедельно</p>
      </div>

      <div class="charts-mode" role="tablist" aria-label="Раздел">
        <button type="button" class="charts-mode-btn active" id="mode-charts" role="tab" aria-selected="true" onclick="switchChartsMode('charts')">Чарты</button>
        <button type="button" class="charts-mode-btn" id="mode-rising" role="tab" aria-selected="false" onclick="switchChartsMode('rising')">Быстрорастущие</button>
      </div>

      <nav class="charts-genres" id="charts-genres" aria-label="Жанры">
        <button type="button" class="charts-genre-btn active" data-genre="all" onclick="switchGenre(this,'all')">Все жанры</button>
        <button type="button" class="charts-genre-btn" data-genre="pop" onclick="switchGenre(this,'pop')">Поп</button>
        <button type="button" class="charts-genre-btn" data-genre="rap" onclick="switchGenre(this,'rap')">Рэп</button>
        <button type="button" class="charts-genre-btn" data-genre="hip-hop" onclick="switchGenre(this,'hip-hop')">Хип-хоп</button>
        <button type="button" class="charts-genre-btn" data-genre="electro" onclick="switchGenre(this,'electro')">Электронная</button>
        <button type="button" class="charts-genre-btn" data-genre="rock" onclick="switchGenre(this,'rock')">Рок</button>
      </nav>
    </header>

    <section id="panel-charts" class="charts-panel" role="tabpanel">
      <div id="charts-list">
        <div class="loading-placeholder"><span class="mrf-ball-spin" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
      </div>
    </section>

    <section id="panel-rising" class="charts-panel" role="tabpanel" hidden>
      <div id="rising-list">
        <div class="loading-placeholder"><span class="mrf-ball-spin" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
      </div>
    </section>

  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="backend.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
var _genre = 'all';
var _chartsMode = 'charts';
var _rawCharts = [];
var _risingLoaded = false;

whenDomReady(() => {
  initShared();
  switchChartsMode('charts', { silent: true });
  if (window.__mrfSoftNavigating) return;
  loadCharts();
});

function switchChartsMode(mode, opts) {
  const silent = !!(opts && opts.silent);
  _chartsMode = mode === 'rising' ? 'rising' : 'charts';

  const btnCharts = document.getElementById('mode-charts');
  const btnRising = document.getElementById('mode-rising');
  const panelCharts = document.getElementById('panel-charts');
  const panelRising = document.getElementById('panel-rising');
  const genres = document.getElementById('charts-genres');
  const title = document.getElementById('charts-hero-title');
  const sub = document.getElementById('charts-hero-sub');

  const isCharts = _chartsMode === 'charts';
  btnCharts?.classList.toggle('active', isCharts);
  btnRising?.classList.toggle('active', !isCharts);
  btnCharts?.setAttribute('aria-selected', isCharts ? 'true' : 'false');
  btnRising?.setAttribute('aria-selected', isCharts ? 'false' : 'true');

  if (panelCharts) panelCharts.hidden = !isCharts;
  if (panelRising) panelRising.hidden = isCharts;
  if (genres) genres.hidden = !isCharts;

  if (title) title.textContent = isCharts ? 'Мировые чарты' : 'Быстрорастущие';
  if (sub) {
    sub.textContent = isCharts
      ? 'Топ-100 треков · обновляется еженедельно'
      : 'Треки, которые резко набирают прослушивания';
  }

  if (!silent) {
    const feed = document.getElementById('feed') || document.querySelector('.feed');
    if (feed) feed.scrollTop = 0;
  }

  if (!isCharts && !_risingLoaded) loadRising();
  else if (typeof syncPlayingRows === 'function') syncPlayingRows();
}

async function loadCharts() {
  const box0 = document.getElementById('charts-list');
  if (box0) box0.innerHTML = `<div class="loading-placeholder"><span class="mrf-ball-spin" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>`;
  // BACKEND TODO: Получение мировых чартов (топ-100)
  let all = (await dzArr('/chart/0/tracks?limit=100')).map(normDZ);
  if (_genre !== 'all') {
    const q = encodeURIComponent(_genre);
    const genreTracks = (await dzArr(`/search/track?q=${q}&limit=100`)).map(normDZ);
    if (genreTracks.length) all = genreTracks;
  }
  if (!document.getElementById('charts-list')) return;
  _rawCharts = all;
  _src['charts'] = all;
  // Keep world top-100 for home → full-queue playback (ignore genre filter)
  if (_genre === 'all') _src['charts_world'] = all;
  renderChartsList(all);
  if (typeof syncPlayingRows === 'function') syncPlayingRows();
}
window.loadCharts = loadCharts;

function renderChartsList(all) {
  const box = document.getElementById('charts-list');
  if (!box) return;
  box.innerHTML = all.length
    ? `<div class="track-list charts-track-list">${all.map((t,i) => rowHTMLChart(t,i)).join('')}</div>`
    : `<p style="color:var(--text-3)">Не удалось загрузить</p>`;
}

function rowHTMLChart(t, i) {
  const cover  = t.album?.cover_medium || '';
  const fav    = Store.isFav(t);
  const tid    = t.id != null ? String(t.id) : '';
  const primaryArtist = t.artist?.name || '';
  const playing= typeof queueIndex !== 'undefined' && queueIndex >= 0 && queue[queueIndex]?.id === t.id;
  const live   = playing && typeof isPlaying !== 'undefined' && isPlaying && typeof audio !== 'undefined' && audio && !audio.paused;
  const topCls = i===0?' top-1':i===1?' top-2':i===2?' top-3':'';
  const playIco = `<svg class="play-hover" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>`;
  const eq = typeof eqBarsHTML === 'function' ? eqBarsHTML() : `<span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
  return `
  <div class="track-item${playing?' playing':''}${playing && !live?' is-paused':''}${topCls}" data-track-id="${escHtml(tid)}" data-fav-title="${escHtml(t.title||'')}" data-fav-artist="${escHtml(primaryArtist)}" onclick="playFromSrc('charts',${i})" oncontextmenu="showTrackMenu(event,${i},'charts');return false">
    <div class="track-num">
      <span class="num-text">${i + 1}</span>
      ${eq}
      ${playIco}
    </div>
    ${cover ? `<img class="track-cover" src="${cover}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<div class="track-cover-placeholder">${noteSVGShared()}</div>`}
    <div class="track-info">
      <div class="track-title">${escHtml(t.title||'')}</div>
      <div class="track-artist">${escHtml(t.artist?.name||'')} · ${escHtml(t.album?.title||'')}</div>
    </div>
    <div class="track-duration">${fmtDur(t.duration)}</div>
    <button type="button" class="track-like-btn${fav?' liked':''}" data-fav-id="${escHtml(tid)}" data-fav-title="${escHtml(t.title||'')}" data-fav-artist="${escHtml(primaryArtist)}" onclick="event.stopPropagation();toggleFavChart(${i},this)" title="${fav?'Убрать':'В избранное'}">
      <svg viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="track-menu-btn" onclick="event.stopPropagation();showTrackMenu(event,${i},'charts')" title="Ещё">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
  </div>`;
}

function toggleFavChart(idx, btn) {
  if (typeof toggleFavByIdx === 'function') return toggleFavByIdx(idx, 'charts', btn);
  const t = _src['charts']?.[idx]; if (!t) return;
  const added = Store.toggleFav({ id: t.id, deezerId: t.deezerId || (typeof deezerIdOf === 'function' ? deezerIdOf(t) : null), title: t.title, artistName: t.artist?.name, artist: t.artist, cover: t.album?.cover_medium, album: t.album, duration: t.duration, preview: t.preview });
  if (typeof applyLikeBtnState === 'function') applyLikeBtnState(btn, added);
  else { btn.classList.toggle('liked', added); btn.querySelector('path')?.setAttribute('fill', added ? 'currentColor' : 'none'); }
  updateFavBadge();
  if (typeof syncFavIcons === 'function') syncFavIcons();
}

function switchGenre(btn, genre) {
  document.querySelectorAll('#charts-genres .charts-genre-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _genre = genre;
  loadCharts();
}

async function loadRising() {
  const rbox = document.getElementById('rising-list');
  if (rbox) rbox.innerHTML = `<div class="loading-placeholder"><span class="mrf-ball-spin" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>`;
  // BACKEND TODO: Быстрорастущие треки
  const rising = (await dzArr('/chart/0/tracks?limit=50')).map(normDZ).slice(15, 45);
  _src['rising'] = rising;
  _risingLoaded = true;
  if (rbox) {
    rbox.innerHTML = rising.length
      ? `<div class="track-list">${rising.map((t,i) => rowHTMLChartRising(t,i)).join('')}</div>`
      : `<p style="color:var(--text-3)">Не удалось загрузить</p>`;
  }
  if (typeof syncPlayingRows === 'function') syncPlayingRows();
}

function rowHTMLChartRising(t, i) {
  const cover  = t.album?.cover_medium || '';
  const fav    = Store.isFav(t);
  const tid    = t.id != null ? String(t.id) : '';
  const primaryArtist = t.artist?.name || '';
  const playing= typeof queueIndex !== 'undefined' && queueIndex >= 0 && queue[queueIndex]?.id === t.id;
  const live   = playing && typeof isPlaying !== 'undefined' && isPlaying && typeof audio !== 'undefined' && audio && !audio.paused;
  const playIco = `<svg class="play-hover" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>`;
  const eq = typeof eqBarsHTML === 'function' ? eqBarsHTML() : `<span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
  return `
  <div class="track-item${playing?' playing':''}${playing && !live?' is-paused':''}" data-track-id="${escHtml(tid)}" data-fav-title="${escHtml(t.title||'')}" data-fav-artist="${escHtml(primaryArtist)}" onclick="playFromSrc('rising',${i})" oncontextmenu="showTrackMenu(event,${i},'rising');return false">
    <div class="track-num">
      <span class="num-text">${i + 1}</span>
      ${eq}
      ${playIco}
    </div>
    ${cover ? `<img class="track-cover" src="${cover}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<div class="track-cover-placeholder">${noteSVGShared()}</div>`}
    <div class="track-info">
      <div class="track-title">${escHtml(t.title||'')}</div>
      <div class="track-artist">${escHtml(t.artist?.name||'')} · ${escHtml(t.album?.title||'')}</div>
    </div>
    <div class="track-duration">${fmtDur(t.duration)}</div>
    <button type="button" class="track-like-btn${fav?' liked':''}" data-fav-id="${escHtml(tid)}" data-fav-title="${escHtml(t.title||'')}" data-fav-artist="${escHtml(primaryArtist)}" onclick="event.stopPropagation();toggleFavRising(${i},this)" title="${fav?'Убрать':'В избранное'}">
      <svg viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="track-menu-btn" onclick="event.stopPropagation();showTrackMenu(event,${i},'rising')" title="Ещё">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
  </div>`;
}

function toggleFavRising(idx, btn) {
  if (typeof toggleFavByIdx === 'function') return toggleFavByIdx(idx, 'rising', btn);
  const t = _src['rising']?.[idx]; if (!t) return;
  const added = Store.toggleFav({ id: t.id, deezerId: t.deezerId || (typeof deezerIdOf === 'function' ? deezerIdOf(t) : null), title: t.title, artistName: t.artist?.name, artist: t.artist, cover: t.album?.cover_medium, album: t.album, duration: t.duration, preview: t.preview });
  if (typeof applyLikeBtnState === 'function') applyLikeBtnState(btn, added);
  else { btn.classList.toggle('liked', added); btn.querySelector('path')?.setAttribute('fill', added ? 'currentColor' : 'none'); }
  updateFavBadge();
  if (typeof syncFavIcons === 'function') syncFavIcons();
}
</script>
</body>
</html>
