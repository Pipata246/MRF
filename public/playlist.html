<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Плейлист — MRF</title>
  <link rel="icon" href="img/favicon.svg?v=2" type="image/svg+xml" sizes="any"/>
  <link rel="stylesheet" href="style.css"/>
  <script>
  /* Layout boot: large screens = PC, smaller = mobile shell */
  (function () {
    try {
      var desktop = window.matchMedia('(min-width: 901px)').matches;
      document.documentElement.setAttribute('data-ui', desktop ? 'desktop' : 'mobile');
    } catch (e) {
      document.documentElement.setAttribute('data-ui', 'mobile');
    }
  })();
  </script>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content" id="main-content">
  <div id="topbar-root"></div>
  <div class="feed" id="playlist-feed">
    <div class="loading-placeholder"><span class="mrf-ball-spin" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="backend.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script>
var _currentPlaylistId = null;

function bootPlaylistPage() {
  initShared();
  loadPlaylistPage();
}
window.bootPlaylistPage = bootPlaylistPage;

if (typeof whenDomReady === 'function') whenDomReady(bootPlaylistPage);
else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootPlaylistPage);
else bootPlaylistPage();

function loadPlaylistPage(forcedId) {
  const params = new URLSearchParams(location.search);
  let id = (forcedId != null && forcedId !== '') ? String(forcedId) : (params.get('id') || '');
  if (!id) {
    try {
      const saved = JSON.parse(sessionStorage.getItem('mrf_route_playlist') || '{}');
      if (saved && saved.id) id = String(saved.id);
    } catch (_) {}
  }
  const feed = document.getElementById('playlist-feed');
  if (!feed) return;

  if (!id) {
    feed.innerHTML = `<div class="search-empty" style="padding:60px 0"><p style="color:var(--text-3)">Плейлист не найден</p>
      <button class="btn-secondary" style="margin-top:14px;padding:9px 16px" onclick="(window.mrfGo||function(u){location.href=u})('playlists.html')">К плейлистам</button></div>`;
    return;
  }

  // Keep id in the address bar so refresh/share survive soft-nav / stripped queries
  if (!params.get('id') || params.get('id') !== id) {
    try {
      const next = (typeof mrfUrl === 'function' ? mrfUrl('playlist', { id }) : `playlist.html?id=${encodeURIComponent(id)}`);
      history.replaceState(history.state || { mrfSoft: 1 }, '', next);
    } catch (_) {}
  }
  try { sessionStorage.setItem('mrf_route_playlist', JSON.stringify({ id: String(id) })); } catch (_) {}

  _currentPlaylistId = id;
  renderPlaylist(id);
}
window.loadPlaylistPage = loadPlaylistPage;

function playlistSrcKey(id) {
  return 'pl_' + String(id);
}

function normalizePlaylistTracks(tracks) {
  return (tracks || []).map(t => {
    const deezerId = t.deezerId
      || (String(t.id || '').startsWith('dz_') ? String(t.id).slice(3) : null)
      || (typeof deezerIdOf === 'function' ? deezerIdOf(t) : null)
      || null;
    const artistName = t.artistName || t.artist?.name || t.artist || '';
    return {
      id: t.id || (deezerId ? `dz_${deezerId}` : t.id),
      deezerId: deezerId || null,
      title: t.title || '',
      artistName,
      artist: typeof t.artist === 'object' && t.artist
        ? t.artist
        : { name: artistName },
      album: { cover_medium: t.cover || t.album?.cover_medium || '', title: t.album?.title || '' },
      cover: t.cover || t.album?.cover_medium || '',
      duration: t.duration || 0,
      preview: t.preview || null,
      source: t.source || 'deezer'
    };
  });
}

function loadVirtualPlaylist(sid) {
  if (!String(sid || '').startsWith('rec_')) return null;
  try {
    const v = JSON.parse(sessionStorage.getItem('mrf_virtual_playlist') || 'null');
    if (v && String(v.id) === String(sid)) return v;
  } catch (_) {}
  return null;
}

function playlistAuthorHandle(pl) {
  const raw = pl?.author?.username || '';
  if (!raw) return '';
  if (window.MrfAuth?.displayUsername) return MrfAuth.displayUsername(raw);
  const s = String(raw).trim().replace(/^@+/, '');
  return s ? '@' + s : '';
}

function saveVirtualPlaylistToLibrary() {
  if (typeof mrfRequireLogin === 'function' && !mrfRequireLogin({ message: 'Чтобы сохранить микс, войди в аккаунт' })) return;
  const sid = String(_currentPlaylistId || '');
  const pl = loadVirtualPlaylist(sid) || Store.getPlaylist(sid);
  if (!pl?.tracks?.length || typeof Store.createPlaylist !== 'function') {
    if (typeof showNotif === 'function') showNotif('Нечего сохранять');
    return;
  }
  const created = Store.createPlaylist(pl.name || 'Микс', '');
  if (!created) return;
  if (pl.cover) Store.updatePlaylist(created.id, { cover: pl.cover });
  pl.tracks.forEach((t) => Store.addTrackToPlaylist(created.id, t));
  if (typeof showNotif === 'function') showNotif('Микс в библиотеке');
  const url = typeof mrfUrl === 'function' ? mrfUrl('playlist', { id: created.id }) : `playlist.html?id=${encodeURIComponent(created.id)}`;
  if (typeof mrfGo === 'function') mrfGo(url);
  else location.href = url;
}
window.saveVirtualPlaylistToLibrary = saveVirtualPlaylistToLibrary;

async function toggleSavePublicPlaylist() {
  const sid = String(_currentPlaylistId || '');
  if (!sid || sid.startsWith('rec_')) return;
  if (typeof mrfRequireLogin === 'function' && !mrfRequireLogin({ message: 'Чтобы добавить плейлист, войди в аккаунт' })) return;
  const local = Store.getPlaylist(sid);
  if (local && Store.isOwnedPlaylist?.(local)) return;
  if (Store.isPlaylistSaved?.(sid)) {
    Store.unsavePlaylist(sid);
    if (typeof showNotif === 'function') showNotif('Убрано');
    if (typeof notifyLibraryChanged === 'function') notifyLibraryChanged();
    renderPlaylist(sid);
    return;
  }
  let pl = local;
  if (!pl || pl.origin === 'public') {
    try {
      const data = typeof mrfApi === 'function'
        ? await mrfApi('/api/library?resource=playlist&id=' + encodeURIComponent(sid))
        : null;
      if (data?.item) pl = data.item;
    } catch (_) {}
  }
  if (!pl) {
    if (typeof showNotif === 'function') showNotif('Плейлист не найден');
    return;
  }
  Store.savePlaylist(pl);
  if (typeof showNotif === 'function') showNotif('Добавлено');
  if (typeof notifyLibraryChanged === 'function') notifyLibraryChanged();
  renderPlaylist(sid);
}
window.toggleSavePublicPlaylist = toggleSavePublicPlaylist;

async function fetchPlaylistForPage(sid) {
  if (!sid || String(sid).startsWith('rec_') || typeof mrfApi !== 'function') return null;
  try {
    const data = await mrfApi('/api/library?resource=playlist&id=' + encodeURIComponent(sid));
    return data?.item || null;
  } catch (_) {
    return null;
  }
}

async function renderPlaylist(id) {
  const sid = String(id || '');
  const feed = document.getElementById('playlist-feed');
  if (!feed) return;

  let pl = Store.getPlaylist(sid);
  if (!pl && typeof MOCK !== 'undefined' && Array.isArray(MOCK.playlists)) {
    pl = MOCK.playlists.find(p => String(p.id) === sid) || null;
  }
  if (!pl) pl = loadVirtualPlaylist(sid);

  const needsLive =
    String(sid).startsWith('pl_') &&
    (!pl || pl.origin === 'saved' || pl.origin === 'public' || pl.readOnly);
  if (needsLive) {
    const remote = await fetchPlaylistForPage(sid);
    if (remote) {
      pl = remote;
      if (remote.origin === 'saved' || Store.isPlaylistSaved?.(sid)) {
        if (window.MrfCloud) MrfCloud._quiet = true;
        try { Store.savePlaylist(remote); } finally {
          if (window.MrfCloud) MrfCloud._quiet = false;
        }
      } else if (remote.origin === 'owned' && Store.isOwnedPlaylist) {
        // keep owned local; live fetch already has tracks
      }
    }
  }

  if (!pl) {
    feed.innerHTML = `<div class="search-empty" style="padding:60px 0"><p style="color:var(--text-3)">Плейлист не найден</p>
      <button class="btn-secondary" style="margin-top:14px;padding:9px 16px" onclick="(window.mrfGo||function(u){location.href=u})('playlists.html')">К плейлистам</button></div>`;
    return;
  }

  const isOwned = typeof Store.isOwnedPlaylist === 'function' ? Store.isOwnedPlaylist(pl) : !(pl.readOnly || pl.origin === 'saved' || pl.origin === 'public');
  const isRecMix = String(pl.id).startsWith('rec_');
  const isPublicForeign = !isOwned && !isRecMix && String(pl.id).startsWith('pl_');
  const readOnly = !isOwned;
  const isDayMix = !!(pl.kind === 'day' || String(pl.id || '').includes('playlist_of_the_day'));
  const isMoodMix = pl.kind === 'mood';
  const authorHandle = playlistAuthorHandle(pl);
  const displayName = pl.name
    || (isDayMix && typeof mrfDayPlaylistTitle === 'function' ? mrfDayPlaylistTitle(pl.localDay) : null)
    || (isRecMix ? 'Микс' : 'Плейлист');
  _currentPlaylistId = String(pl.id);
  try { sessionStorage.setItem('mrf_route_playlist', JSON.stringify({ id: String(pl.id) })); } catch (_) {}
  document.title = displayName + ' — MRF';

  const key = playlistSrcKey(pl.id);
  const ordered = readOnly
    ? (pl.tracks || [])
    : (typeof Store._sortNewestFirst === 'function'
      ? Store._sortNewestFirst(pl.tracks || [])
      : (pl.tracks || []));
  const tracks = normalizePlaylistTracks(ordered);
  _src[key] = tracks;
  const count = tracks.length;

  const coverSrc = pl.cover ? escHtml(String(pl.cover)) : '';
  const safePlId = String(pl.id).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const saved = !!(Store.isPlaylistSaved?.(pl.id) || pl.origin === 'saved');
  let manageBtn = '';
  if (isOwned) {
    manageBtn = `<button type="button" class="btn-secondary playlist-more-btn" onclick="showPlaylistManageMenu(event,'${safePlId}')" title="Ещё" aria-label="Управление плейлистом">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>`;
  } else if (isPublicForeign) {
    manageBtn = `<button type="button" class="btn-secondary playlist-save-btn" onclick="toggleSavePublicPlaylist()">${saved ? 'Убрать' : 'Добавить'}</button>`;
  } else if (isRecMix) {
    manageBtn = `<button type="button" class="btn-secondary playlist-save-btn" onclick="saveVirtualPlaylistToLibrary()">В библиотеку</button>`;
  }

  const kicker = isOwned
    ? 'Плейлист'
    : isPublicForeign
      ? 'Плейлист'
      : isDayMix
        ? 'Микс дня'
        : isMoodMix
          ? 'Настроение'
          : 'Микс';
  const countLine = authorHandle && isPublicForeign
    ? `${escHtml(authorHandle)} · ${count} ${count === 1 ? 'трек' : count < 5 ? 'трека' : 'треков'}`
    : `${count} ${count === 1 ? 'трек' : count < 5 ? 'трека' : 'треков'}`;

  feed.innerHTML = `
    <div class="playlist-page-header liked-header${readOnly ? ' is-rec-mix' : ''}${isDayMix ? ' is-day-mix' : ''}${isMoodMix ? ' is-mood-mix' : ''}">
      ${coverSrc
        ? `<img class="playlist-page-cover" src="${coverSrc}" alt="">`
        : `<div class="liked-cover-placeholder playlist-page-cover-ph">${noteSVGShared()}</div>`}
      <div class="playlist-page-meta">
        <div class="playlist-page-kicker">${kicker}</div>
        <h1 class="playlist-page-title" id="pl-title-display">${escHtml(displayName)}</h1>
        <div class="playlist-page-count" id="pl-track-count">${countLine}</div>
        <div class="playlist-page-actions">
          ${count ? `<button type="button" class="btn-primary" onclick="playPlaylistNow()">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
            <span>Слушать</span>
          </button>
          <button type="button" class="btn-secondary playlist-shuffle-btn" onclick="shufflePlaylistNow()"><span>Перемешать</span></button>` : ''}
          ${manageBtn}
        </div>
      </div>
    </div>
    <div id="playlist-tracks">
      ${count
        ? `<div class="track-list">${tracks.map((t,i) => rowHTMLPlaylist(t, i, key, pl.id)).join('')}</div>`
        : `<div class="search-empty" style="padding:48px 0">
            <p style="color:var(--text-3)">Плейлист пуст</p>
            ${readOnly ? '' : `<button class="btn-primary" style="margin-top:14px;padding:10px 18px;font-size:13px" onclick="showAddTracksToPlaylist('${escHtml(String(pl.id))}')">Добавить треки</button>`}
          </div>`}
    </div>`;

  if (typeof syncPlayingRows === 'function') syncPlayingRows();
}
window.renderPlaylist = renderPlaylist;

function rowHTMLPlaylist(t, i, key, plId) {
  const cover  = t.album?.cover_medium || t.cover || '';
  const artist = t.artist?.name || t.artistName || t.artist || '';
  // Ensure feat. names are on the track object for link rendering
  if ((!t.artists || t.artists.length < 2) && typeof parseFeatNames === 'function') {
    const feats = parseFeatNames(t.title || '');
    if (feats.length) {
      const base = trackArtists(t);
      t.artists = typeof uniqArtists === 'function'
        ? uniqArtists([...base, ...feats.map(n => ({ name: n, id: null }))])
        : [...base, ...feats.map(n => ({ name: n, id: null }))];
    }
  }
  const artistHtml = typeof artistsLinksHTML === 'function'
    ? artistsLinksHTML(t, 'artist-link track-artist-link')
    : escHtml(typeof formatArtistsText === 'function' ? formatArtistsText(t) : artist);
  const fav    = Store.isFav(t);
  const tid    = t.id != null ? String(t.id) : '';
  const primaryArtist = t.artist?.name || t.artistName || artist || '';
  const playing= typeof queueIndex !== 'undefined' && queueIndex >= 0 && queue[queueIndex]?.id === t.id;
  const live   = playing && typeof isPlaying !== 'undefined' && isPlaying && typeof audio !== 'undefined' && audio && !audio.paused;
  const eq = typeof eqBarsHTML === 'function' ? eqBarsHTML() : `<span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
  const playIco = `<svg class="play-hover" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M8 5v14l11-7z"/></svg>`;
  const safePl = String(plId).replace(/'/g, "\\'");
  const safeTid = tid.replace(/'/g, "\\'");
  return `
  <div class="track-item${playing?' playing':''}${playing && !live?' is-paused':''}" data-track-id="${escHtml(tid)}" data-fav-title="${escHtml(t.title||'')}" data-fav-artist="${escHtml(primaryArtist)}" onclick="playFromSrc('${key}',${i})" oncontextmenu="showTrackMenu(event,${i},'${key}');return false">
    <div class="track-num"><span class="num-text">${i+1}</span>${eq}${playIco}</div>
    ${cover ? `<img class="track-cover" src="${cover}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<div class="track-cover-placeholder">${noteSVGShared()}</div>`}
    <div class="track-info">
      <div class="track-title">${escHtml(t.title||'')}</div>
      <div class="track-artist">${artistHtml}</div>
    </div>
    <div class="track-duration">${fmtDur(t.duration)}</div>
    <button type="button" class="track-like-btn${fav?' liked':''}" data-fav-id="${escHtml(tid)}" data-fav-title="${escHtml(t.title||'')}" data-fav-artist="${escHtml(primaryArtist)}" onclick="event.stopPropagation();toggleFavPlaylist('${key}',${i},this)" title="${fav?'Убрать':'В избранное'}">
      <svg viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button type="button" class="track-menu-btn" onclick="event.stopPropagation();showTrackMenu(event,${i},'${key}')" title="Ещё">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
  </div>`;
}

function playPlaylistNow() {
  const key = playlistSrcKey(_currentPlaylistId);
  if (_src[key]?.length) playFromSrc(key, 0);
}

function shufflePlaylistNow() {
  const key = playlistSrcKey(_currentPlaylistId);
  const tracks = _src[key];
  if (!tracks?.length) return;
  if (typeof isShuffle !== 'undefined') isShuffle = true;
  const start = Math.floor(Math.random() * tracks.length);
  playFromSrc(key, start);
  if (typeof updateShuffleBtn === 'function') updateShuffleBtn();
  showNotif('Перемешивание включено');
}

function toggleFavPlaylist(key, idx, btn) {
  if (typeof toggleFavByIdx === 'function') return toggleFavByIdx(idx, key, btn);
  const t = _src[key]?.[idx]; if (!t) return;
  const artist = t.artist?.name || t.artistName || '';
  const added = Store.toggleFav({
    id: t.id,
    deezerId: (typeof deezerIdOf === 'function' ? deezerIdOf(t) : null) || t.deezerId || null,
    title: t.title, artistName: artist, artist: t.artist,
    cover: t.album?.cover_medium || t.cover, album: t.album, duration: t.duration, preview: t.preview
  });
  if (typeof applyLikeBtnState === 'function') applyLikeBtnState(btn, added);
  else { btn.classList.toggle('liked', added); btn.querySelector('path')?.setAttribute('fill', added ? 'currentColor' : 'none'); }
  if (typeof syncFavIcons === 'function') syncFavIcons();
  if (typeof notifyLibraryChanged === 'function') notifyLibraryChanged();
  else updateFavBadge();
}

function removeFromCurrentPlaylist(plId, trackId) {
  const id = String(plId || '');
  if (!id || id.startsWith('rec_')) return;
  const pl = Store.getPlaylist?.(id);
  if (!pl || pl.readOnly) return;
  Store.removeTrackFromPlaylist(id, trackId);
  renderPlaylist(id);
  if (typeof notifyLibraryChanged === 'function') notifyLibraryChanged();
  showNotif('Трек удалён из плейлиста');
}

function editPlaylistName(id) {
  if (typeof showRenamePlaylist === 'function') showRenamePlaylist(id);
}

function deleteThisPlaylist(id) {
  const pl = Store.getPlaylist?.(id);
  if (pl && typeof Store.isOwnedPlaylist === 'function' && !Store.isOwnedPlaylist(pl)) {
    Store.unsavePlaylist(id);
    if (typeof notifyLibraryChanged === 'function') notifyLibraryChanged();
    if (typeof showNotif === 'function') showNotif('Убрано');
    renderPlaylist(id);
    return;
  }
  if (!confirm('Удалить плейлист?')) return;
  Store.deletePlaylist(id);
  if (typeof notifyLibraryChanged === 'function') notifyLibraryChanged();
  const url = typeof mrfUrl === 'function' ? mrfUrl('playlists') : 'playlists.html';
  if (typeof mrfGo === 'function') mrfGo(url);
  else location.href = url;
}

/** Context menu for playlist management (same chrome as track ⋯ menu) */
function showPlaylistManageMenu(e, plId) {
  e.preventDefault();
  e.stopPropagation();
  const id = String(plId || _currentPlaylistId || '');
  // Recommendation mixes are read-only — only "save to library"
  if (id.startsWith('rec_')) {
    saveVirtualPlaylistToLibrary();
    return;
  }
  const cur = Store.getPlaylist?.(id);
  if (cur && typeof Store.isOwnedPlaylist === 'function' && !Store.isOwnedPlaylist(cur)) {
    toggleSavePublicPlaylist();
    return;
  }
  if (typeof hideTrackMenu === 'function') hideTrackMenu(true);

  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.addEventListener('click', ev => ev.stopPropagation());

  const btn = e.currentTarget || e.target?.closest?.('.playlist-more-btn');
  let x = e.clientX;
  let y = e.clientY;
  if (btn?.getBoundingClientRect) {
    const br = btn.getBoundingClientRect();
    x = br.right;
    y = br.bottom + 6;
  }

  const safe = id.replace(/'/g, "\\'");
  menu.innerHTML = `
    <button type="button" class="ctx-item" data-pl="add">
      <svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Добавить треки
    </button>
    <button type="button" class="ctx-item" data-pl="rename">
      <svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M4 20h4l10-10-4-4L4 16v4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Переименовать
    </button>
    <div class="ctx-divider"></div>
    <button type="button" class="ctx-item ctx-item-danger" data-pl="delete">Удалить плейлист</button>
  `;

  menu.addEventListener('click', ev => {
    const el = ev.target.closest?.('[data-pl]');
    if (!el) return;
    const act = el.getAttribute('data-pl');
    if (typeof hideTrackMenu === 'function') hideTrackMenu();
    else menu.remove();
    if (act === 'add') showAddTracksToPlaylist(safe);
    else if (act === 'rename') showRenamePlaylist(safe);
    else if (act === 'delete') deleteThisPlaylist(safe);
  });

  menu.style.position = 'fixed';
  menu.style.left = '-9999px';
  menu.style.top = '0';
  menu.style.zIndex = '4000';
  document.body.appendChild(menu);
  if (typeof window.__bindCtxMenu === 'function') window.__bindCtxMenu(menu);
  const r = menu.getBoundingClientRect();
  let left = x - r.width;
  let top = y;
  if (left < 8) left = Math.min(x, innerWidth - r.width - 8);
  if (left < 8) left = 8;
  if (top + r.height > innerHeight - 8) top = Math.max(8, y - r.height - 8);
  if (top < 8) top = 8;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => menu.classList.add('is-open'));
  });
  setTimeout(() => document.addEventListener('click', () => {
    if (typeof hideTrackMenu === 'function') hideTrackMenu();
  }, { once: true }), 0);
}
window.showPlaylistManageMenu = showPlaylistManageMenu;
</script>
</body>
</html>
