<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Моя библиотека — MRF</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<main class="main-content">
  <div id="topbar-root"></div>
  <div class="feed">

    <div class="library-header">
      <h2 class="section-title" style="font-size:24px">Моя библиотека</h2>
      <div class="library-controls">
        <button class="lib-view-btn active" id="lib-view-grid" onclick="setLibView('grid')" title="Сетка">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="lib-view-btn" id="lib-view-list" onclick="setLibView('list')" title="Список">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="btn-secondary" style="padding:8px 12px;font-size:12px" onclick="toggleSelectMode()">Выбрать</button>
        <button class="btn-primary" style="padding:8px 16px;font-size:12px" onclick="showCreatePlaylist()">
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Плейлист
        </button>
      </div>
    </div>

    <div class="lib-toolbar">
      <input class="lib-search" id="lib-search" placeholder="Поиск в библиотеке…" oninput="onLibSearch()"/>
      <select class="lib-sort" id="lib-sort" onchange="onLibSort()">
        <option value="date">По дате</option>
        <option value="title">По названию</option>
        <option value="artist">По исполнителю</option>
        <option value="duration">По длительности</option>
      </select>
    </div>

    <div class="lib-bulk-bar" id="lib-bulk">
      <span id="lib-bulk-count">0 выбрано</span>
      <button class="btn-secondary" style="padding:7px 12px;font-size:12px" onclick="bulkAddQueue()">В очередь</button>
      <button class="btn-secondary" style="padding:7px 12px;font-size:12px" onclick="bulkAddPlaylist()">В плейлист</button>
      <button class="btn-secondary" style="padding:7px 12px;font-size:12px;color:#e74c3c" onclick="bulkRemoveFavs()">Удалить</button>
      <button class="btn-secondary" style="padding:7px 12px;font-size:12px" onclick="clearLibSelection()">Снять</button>
    </div>

    <div class="lib-filters">
      <button class="lib-filter active" onclick="switchLibTab('all',this)">Всё</button>
      <button class="lib-filter" onclick="switchLibTab('tracks',this)">Любимые треки</button>
      <button class="lib-filter" onclick="switchLibTab('playlists',this)">Плейлисты</button>
      <button class="lib-filter" onclick="switchLibTab('albums',this)">Альбомы</button>
      <button class="lib-filter" onclick="switchLibTab('artists',this)">Исполнители</button>
    </div>

    <div id="lib-content"></div>
  </div>
</main>
<div id="player-root"></div>
<script src="mock.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>
<script src="mrf-ready.js"></script>
<script src="soft-nav.js"></script>
<script src="library-page.js"></script>
</body>
</html>
